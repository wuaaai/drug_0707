[project]
name = "personalmed"
version = "0.1.0"
description = "PersonalMed - Medical EHR prediction with deep learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.4.1",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "mne>=1.12.1",
    "numpy>=1.26,<2",
    "pandarallel>=1.6.5",
    "pandas>=1.5,<2",
    # pyhealth 1.1.6 wheel is broken on PyPI, installed manually from local copy
    # "pyhealth>=1.1.6",
    "rdkit>=2026.3.3",
    "scikit-learn>=1.9.0",
    "setuptools>=81.0.0",
    "torch>=2.12.1",
    "torch-geometric>=2.8.0",
    "torchvision>=0.27.1",
    "tqdm>=4.68.3",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
